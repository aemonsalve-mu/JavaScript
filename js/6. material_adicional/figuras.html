<!DOCTYPE html>
<meta charset="utf-8">

<!-- Load d3.js -->
<script src="https://d3js.org/d3.v4.js"></script>

<!-- Create a div where the graph will take place -->
<div id="dibujin"></div>

<script>

    // set the dimensions and margins of the graph
    var margin = {top: 40, right: 40, bottom: 40, left: 40},
        width = 1080 - margin.left - margin.right,
        height = 980 - margin.top - margin.bottom;
    
    // append the svg object to the body of the page
    var svg = d3.select("#dibujin")
      .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
      .append("g")
        .attr("transform",
              "translate(" + margin.left + "," + margin.top + ")");
    
    var cabeza = svg.append("g")
    
    cabeza.append('circle')
        .attr("id","Cabeza")
        .attr('cx', 500)
        .attr('cy', 200)
        .attr('r', 50)
        .style('stroke', 'black')
        .style('fill', '#69a3b2');
    
    cabeza.append("ellipse")
        .attr("id","pupila")
        .attr("cx",480)
        .attr("cy",180)
        .attr("rx",10)
        .attr("ry",7)
        .style("stroke","black")
        .style("black","white");

    cabeza.append("circle")
        .attr("id","ojo")
        .attr("cx",480)
        .attr("cy",180)
        .attr("r",5)
        .style("stroke","black")
        .style("fill","white");

    cabeza.append("ellipse")
        .attr("id","pupila2")
        .attr("cx",520)
        .attr("cy",180)
        .attr("rx",10)
        .attr("ry",7)
        .style("stroke","black")
        .style("black","white");

    cabeza.append("circle")
        .attr("id","ojo")
        .attr("cx",520)
        .attr("cy",180)
        .attr("r",5)
        .style("stroke","black")
        .style("fill","white");

    


    var cuerpo = svg.append("g")

    cuerpo.append("rect")
        .attr("x",495)
        .attr("y",250)
        .style("width",10)
        .style("height",200);

    cuerpo.append("rect")
        .attr("x",400)
        .attr("y",300)
        .style("width",200)
        .style("height",5);

    cuerpo.append("line")
        .attr("x1",375)
        .attr("y1",280)
        .attr("x2",402)
        .attr("y2",302)
        .style("stroke","black")
        .style("stroke-width",5)

    cuerpo.append("line")
        .attr("x1",375)
        .attr("y1",290)
        .attr("x2",402)
        .attr("y2",302)
        .style("stroke","black")
        .style("stroke-width",5);

    update();
	var grados = 10
    update2();

	function update2(){
	grados = grados + 10
        d3.select("#pupila2").
            transition()
            .ease(d3.easeLinear)
            .duration(1)
            .attr("transform","rotate("+grados+",520,180)")	
            .on("end",update2)
    }; 

    function update(){
        cuerpo.
            transition()
            .ease(d3.easeLinear)
            .duration(500)
            .style("fill","red")
            .transition()
            .ease(d3.easeLinear)
            .duration(2000)
            .style("fill","black")
            .on("end",update)
    }    
    </script>

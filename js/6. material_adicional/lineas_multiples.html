<!DOCTYPE html>
<html>
    <meta charset="utf-8">

    
    <title> Gráfico de líneas múltiples</title>

    <!-- Carga de las librerías que se utilizarán -->
    <script src="https://d3js.org/d3.v4.js"></script>


    
    <body>
        <div id="lineas"></div>
    </body>
    
</html>

<script>
    var margin = {top:20, rigth:20, bottom: 30, left: 50},
    width = 960 - margin.left - margin.rigth,
    height = 500 - margin.top - margin.bottom;

    var parseFecha = d3.timeParse("%Y-%m-%dT%H:%M:%S");

    var x = d3.scaleTime().range([0,width]);
    var y = d3.scaleLinear().range([height,0]);

    var svg = d3.select("#lineas").append("svg")
    .attr("width", width + margin.left + margin.rigth)
    .attr("height",height + margin.top + margin.bottom)
    .append("g")
    .attr("transform", "translate(" + margin.left + ", " + margin.top +")");

    d3.csv("https://raw.githubusercontent.com/AJM05/Bdata3-Visualizaci-n-datos/main/Lineas%20multiples.csv", function(data){
        
        data.forEach(function(d){
            d.date = parseFecha(d.date);
            d.close = +d.close;
        });

        data.sort(function(a,b){
            return new Date(b.date) - new Date(a.date);
        })

        var sumstat = d3.nest()
        .key(function(d){return d.symbol})
        .entries(data);

        x.domain(d3.extent(data,function(d){return d.date;}));
        y.domain([0,d3.max(data,function(d){return d.close})]);

        var res = sumstat.map(function(d){return d.key});
        var color = d3.scaleOrdinal()
        .domain(res)
        .range(["#e41a1c","#ff7f00","#377eb8"]);

        svg.selectAll(".line")
        .data(sumstat)
        .enter()
        .append("path")
        .attr("fill","none")
        .attr("stroke",function(d){return color(d.key)})
        .attr("stroke-width",1.5)
        .attr("d",function(d){
            return d3.line()
            .x(function(d){return( x(d.date))})
            .y(function(d){return y(d.close)})
            (d.values)
        })

        svg.append("g")
        .attr("transform","translate(0," + height + ")")
        .call(d3.axisTop(x));

        svg.append("g")
        .call(d3.axisLeft(y))
    })


</script>

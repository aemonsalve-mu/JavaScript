<!DOCTYPE html>
<html>
    <meta charset="utf-8">
    <style>
        .grid line{
            stroke: lightcoral;
            stroke-opacity: 0.7;
            shape-rendering: crispEdges 
        }

        .grid path{
            stroke-width: 0;
        }
    </style>
    
    <title> Gráfico de líneas </title>

    <!-- Carga de las librerías que se utilizarán -->
    <script src="https://d3js.org/d3.v4.js"></script>


    
    <body>
        <div id="lineas"></div>
    </body>
    
</html>

<script>

    var margin = {top: 20, rigth: 20, bottom: 120, left:50}, 
    width = 960 -margin.left - margin.rigth,
    height = 800 - margin.top - margin.bottom;

    var parseFecha = d3.timeParse("%Y-%m-%dT%H:%M:%S");

    var x = d3.scaleTime().range([0,width]);
    var y = d3.scaleLinear().range([height,0]);


    var area = d3.area()
    .x(function(d){return x(d.date)})
    .y0(height)
    .y1(function(d){ return y(d.close)});


    var valueline = d3.line()
    .x(function(d){ return x(d.date)})
    .y(function(d){return y(d.close)});

    var valueline2 = d3.line()
    .x(function(d){ return x(d.date)})
    .y(function(d){return y(d.open)});

    function lineas_ref_x(){
    return d3.axisBottom(x)
        .ticks(5)
    }


    var svg = d3.select("#lineas").append("svg")
    .attr("width", width + margin.left + margin.rigth)
    .attr("height",height + margin.top + margin.bottom)
    .append("g")
    .attr("transform", "translate(" + margin.left + ", " + margin.top +")");

    d3.csv("https://raw.githubusercontent.com/AJM05/Bdata3-Visualizaci-n-datos/main/AENA.csv",
    function(error,datos){
        if(error) throw error;

        datos.forEach(function(d){
            d.date = parseFecha(d.date);
            d.close = +d.close;
            d.open = +d.open;
        })

        datos.sort(function(a,b){
            return new Date(b.date) - new Date(a.date);
        })

        x.domain(d3.extent(datos, function(d){return d.date }))
        y.domain([0, d3.max(datos,function(d){return Math.max(d.close,d.open)})])

/*
        svg.append("path")
        .data([datos])
        .attr("class","area")
        .attr("d",area)
        .style("fill","lightsteelblue")

*/
        svg.append("path")
        .data([datos])
        .attr("class","line")
        .style("fill","none")
        .style("stroke","green")
        .style("stroke-dasharray",("3,3,7,3"))
        .attr("d",valueline);

        svg.append("path")
        .data([datos])
        .attr("class","line")
        .style("fill","none")
        .style("stroke","red")
        .attr("d",valueline2);

        /*
        svg.selectAll("dot")
        .data(datos)
        .enter().append("circle")
        .attr("r",1)
        .attr("cx",function(d){
            return x(d.date)
        })
        .attr("cy",function(d){
            return y(d.close)
        })
        .style("fill","black")
        */

        svg.append("g")
        .style("font","14px times")
        .attr("transform","translate(0,"+ height + ")")
        .call(d3.axisBottom(x)
        .ticks(d3.timeMonth.every(4))
        ).selectAll("text")
        .style("text-anchor","end")
        .attr("dx","-.8em")
        .attr("dy",".15em")
        .attr("transform","rotate(-65)");

        svg.append("g")
        .attr("class","grid")
        .attr("transform","translate(0," + height + ")")
        .call(lineas_ref_x().tickSize(-height).tickFormat(""))

        svg.append("text")
        .attr("x",width/2)
        .attr("y",height+margin.top+60)
        .style("text-anchor","middle")
        .style("text-decoration","underline")
        .text("Fecha")

        svg.append("g")
        .call(d3.axisLeft(y));
    })



</script>

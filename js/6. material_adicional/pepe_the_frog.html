<!DOCTYPE html>
<html>
    <meta charset="utf-8">
    
    <title> Pepe la rana </title>

    <!-- Carga de las librerías que se utilizarán -->
    <script src="https://d3js.org/d3.v4.js"></script>


    
    <body>
        <div id="div"></div>
    </body>
    
</html>


<script>

var svg = d3.select("div").append("svg")
    .attr("width", 1920)
    .attr("height", 1080);

var pepe = svg.append("g")

//cuerpo y cabeza
pepe.append("ellipse")
.attr("cx",960)
.attr("cy",200)
.attr("rx",105)
.attr("ry",110)
.style("fill","#689948")
.style("stroke","none");


//piernas

pepe.append("rect")
.attr("x",1000)
.attr("y",380)
.attr("height",80)
.attr("width",20)
.style("fill","lightgrey");

pepe.append("clipPath")
.attr("id","pierna_derecha")
.append("ellipse")
.attr("cx",1034)
.attr("cy",450)
.attr("rx",38)
.attr("ry",11)
.style("fill","lightgrey");

pepe.append("rect")
    .attr("x", 1000)
    .attr("y", 380)
    .attr("clip-path","url(#pierna_derecha)")
    .attr("height", 80)
    .attr("width", 75)
    .style("fill", "lightgrey");

pepe.append("rect")
    .attr("x",900)
    .attr("y",380)
    .attr("height",80)
    .attr("width",20)
    .style("fill","lightgrey");

pepe.append("clipPath")
    .attr("id","pierna_izquierda")
    .append("ellipse")
    .attr("cx",883)
    .attr("cy",450)
    .attr("rx",38)
    .attr("ry",11)
    .style("fill","lightgrey");

pepe.append("rect")
    .attr("x", 845)
    .attr("y", 380)
    .attr("clip-path","url(#pierna_izquierda)")
    .attr("height", 80)
    .attr("width", 75)
    .style("fill", "lightgrey");

//brazo
var brazo_izq = [{x: 1070, y: 285}, {x: 1095, y: 310}, {x: 1120, y: 350},
     {x: 1130, y: 360}, {x: 1140, y: 380}, 
     {x: 1126, y: 370},{x: 1120, y: 370},{x: 1120, y: 390},{x: 1110, y: 370},{x: 1115, y: 360},
     {x: 1112, y: 350},{x: 1085, y: 310},{x: 1065, y: 295}];

var curva2 = d3.line()
    .curve(d3.curveCatmullRom.alpha(0))              
    .x(function(d) { return d.x })
    .y(function(d) { return d.y });  

pepe.append("path")
.attr("d",curva2(brazo_izq))
.style("stroke","none")
.style("fill","lightgrey")
.on("mouseover",function(d){
    d3.select(this)
    .style("fill","red")
})
.on("mouseout",function(d){
    d3.select(this)
    .transition()
    .duration(1200)
    .style("fill","lightgrey")
});

//cuerpo
pepe.append("ellipse")
.attr("cx",960)
.attr("cy",300)
.attr("rx",120)
.attr("ry",100)
.style("fill","#689948")
.style("stroke","none");

//boca

pepe.append("ellipse")
.attr("cx",950)
.attr("cy",310)
.attr("rx",65)
.attr("ry",35)
.style("fill","black")
.style("stroke","none");

var curva0 = d3.line()
        .curve(d3.curveLinear)              
        .x(function(d) { return d.x })
        .y(function(d) { return d.y });

var diente1 = [{x: 965, y: 280}, {x: 995, y:280}, {x: 980, y: 300},{x: 965, y: 280}]

var diente2 = [{x: 930, y: 278}, {x: 960, y:278}, {x: 945, y: 298},{x: 930, y: 278}]

var diente3 = [{x: 890, y: 280}, {x: 920, y:280}, {x: 905, y: 300},{x: 890, y: 280}]

var diente4 = [{x: 900, y: 340}, {x: 930, y:340}, {x: 915, y: 320},{x: 900, y: 340}]

var diente5 = [{x: 930, y: 350}, {x: 960, y:350}, {x: 945, y: 315},{x: 930, y: 350}]

var diente6 = [{x: 960, y: 350}, {x: 990, y:350}, {x: 975, y: 320},{x: 960, y: 350}]

var dientes = [diente1,diente2,diente3,diente4,diente5,diente6]

pepe.selectAll("path")
.data(dientes)
.enter()
.append("path")
.attr("d",function(d){
    return curva0(d)
})
.style("stroke","none")
.style("fill","#FEFBED")



pepe.append("ellipse")
.attr("cx",950)
.attr("cy",310)
.attr("rx",75)
.attr("ry",40)
.style("fill","none")
.style("stroke","#914430")
.style("stroke-width","20px");


//ojos

pepe.append("ellipse")
.attr("cx",910)
.attr("cy",170)
.attr("rx",20)
.attr("ry",30)
.attr("fill","white")
.attr("stroke","none");

pepe.append("ellipse")
.attr("cx",1010)
.attr("cy",170)
.attr("rx",20)
.attr("ry",30)
.attr("fill","white")
.attr("stroke","none");

pepe.append("ellipse")
.attr("class","pupila")
.attr("cx",910)
.attr("cy",170)
.attr("rx",5)
.attr("ry",10)
.attr("fill","black")
.attr("stroke","none")
.on("click",function(d){
    d3.selectAll(".pupila")
    .transition()
    .duration(1000)
    .ease(d3.easeBounce)
    .attr("rx",6)
    .attr("ry",12)
    .style("fill","red")
    .transition()
    .duration(1000)
    .attr("rx",5)
    .attr("ry",10)
    .style("fill","black")
});

pepe.append("ellipse")
.attr("class","pupila")
.attr("cx",1010)
.attr("cy",170)
.attr("rx",10)
.attr("ry",5)
.attr("fill","black")
.attr("stroke","none");

</script>

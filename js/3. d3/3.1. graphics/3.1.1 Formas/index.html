<!DOCTYPE html>
<html lang="en">

<head>
    <title>Formas</title>
    <!-- Carga de las librerías que se utilizarán -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>

<body>
    <h1>Formas Geométricas</h1>
    <h2>Circulos</h2>
    <div id="circle"></div>

    <!-- Carga del archivo de script que contiene el código para dibujar los círculos -->
    <script src="circulos.js"></script>

    <h2>Rectángulos</h2>
    <div id="rect"></div>

    <!-- Carga del archivo de script que contiene el código para dibujar los rectángulos -->
    <script src="rectangulos.js"></script>

    <h2>Segmentos/lineas</h2>
    <div id="segment"></div>
    
    <!-- Carga del archivo de script que contiene el código para dibujar las líneas -->
    <script src="lineas.js"></script>

    <h2>Lineas compuestas</h2>  
    <div id="line"></div>

    <!-- Carga del archivo de script que contiene el código para dibujar las líneas compuestas -->
    <script src="lineas_compuestas.js"></script>

    <h2>Curvas</h2>
    <div id="curve"></div>

    <!-- Carga del archivo de script que contiene el código para dibujar las curvas -->
    <script src="curvas.js"></script>

    <h2>Areas</h2>
    <div id="area"></div>

    <script src="areas.js"></script>

    <h2>Arcos</h2>
    <div id="arc"></div>

    <!-- Carga del archivo de script que contiene el código para dibujar los arcos -->
    <script src="arcos.js"></script>

</body>

</html>
